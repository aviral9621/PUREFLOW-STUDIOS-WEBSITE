# Secure Build Checklist A1 — runs on every push and pull request.
# Type check, build, dependency audit (critical blocks; high is reported) and a
# gitleaks scan of the commits in this push (full history was scanned on 8 Oct 2026).
name: Security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: |
          npm audit --audit-level=high || true
          npm audit --audit-level=critical
      - name: Secret scan (this push)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then RANGE="-1"; else RANGE="$BEFORE..${{ github.sha }}"; fi
          ./gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="$RANGE"
